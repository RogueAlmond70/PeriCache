services:
  cache:
    build: .
    container_name: nandos-cache
    ports:
      - "8080:8080"
    environment:
      CACHE_MODE: server
      CACHE_ADDR: ":8080"
      CACHE_STORE: mongo
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: nandos_cache
      METRICS_BACKEND: both
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: nandos-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: nandos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cache
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: nandos-grafana
    ports:
      - "3000:3000"
    env_file:
      - ./config/grafana.env
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongo_data:
